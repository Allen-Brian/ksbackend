name: CI

# One pipeline: verify → build image → deploy.
#   pull_request        verify only
#   push to main        verify → build → deploy dev (→ staging, when enabled)
#   tag v*              verify → build → deploy prod (when enabled)
#
# Stages are gated by repository variables so the wiring exists before the
# target does — flip STAGING_DEPLOY_ENABLED / PROD_DEPLOY_ENABLED to "true" in
# Settings → Variables to switch a stage on. See docs/deployment.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  # One deploy at a time per ref; never cancel a deploy mid-flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kanasante/api

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (oxlint)
        run: bun run lint

      - name: Format check (oxfmt)
        run: bun run format:check

      - name: Type-check (tsc)
        run: bun run typecheck

      - name: Structure / naming / import-boundary check
        run: bun run check:structure

      - name: Migration drift check
        # The committed migrations must fully reflect src/db/schema — if
        # drizzle-kit generates anything new, someone forgot `bun run db:generate`.
        env:
          DATABASE_URL: postgres://drift:check@localhost:5432/drift
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Schema drift detected — run 'bun run db:generate' and commit the migration."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Test (vitest — unit + api)
        run: bun run test

      # Integration tests provision their own Postgres via Testcontainers
      # (Docker is available on ubuntu-latest by default).
      - name: Integration tests (Testcontainers)
        run: bun run test:integration

  build:
    # Only builds for refs that can deploy; PRs stop at `verify`.
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Image tag
        # Immutable per-commit tag; the deploy pins this exact tag on the VM.
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploys ─────────────────────────────────────────────────────────────────
  # All three stages share one reusable job body via the matrix-less pattern
  # below: identical steps, different GitHub Environment (which scopes the
  # DEPLOY_* variables + secrets and lets prod require reviewers).

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev-api.kanasante.com/docs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          stage: dev
          image-tag: ${{ needs.build.outputs.tag }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-staging:
    # DISABLED until vars.STAGING_DEPLOY_ENABLED == "true". Promotes the same
    # image dev just received, after dev succeeded.
    if: github.ref == 'refs/heads/main' && vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-api.kanasante.com/docs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          stage: staging
          image-tag: ${{ needs.build.outputs.tag }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

  deploy-prod:
    # DISABLED until vars.PROD_DEPLOY_ENABLED == "true". Triggered by a v* tag,
    # never by a branch push. Add required reviewers on the `prod` environment.
    if: github.ref_type == 'tag' && vars.PROD_DEPLOY_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://api.kanasante.com/docs
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        with:
          stage: prod
          image-tag: ${{ needs.build.outputs.tag }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
